# TEST ONLY (do not merge): BigBuild warm-clone cache demo, wired to run on the
# dotnet-roslyn-test-CI pipeline (def 1233) by replacing its entry YAML on this branch.
#
# def 1233 executes /azure-pipelines.yml from whatever branch is queued, as a plain (non-1ES-
# extends) stages pipeline, so we can drive the whole warm-cache demo from here without needing
# permission to CREATE a pipeline definition -- we only need Queue rights on an existing def.
#
# Self-seeding, per-branch capture/replay cache over Compilers.slnf using ONLY Pipeline Artifacts:
#   1. pull THIS branch's previous run's `warmcache` artifact (the last baseline),
#   2. seed this checkout from it (overlay outputs + back-date unchanged inputs),
#   3. build Compilers.slnf -- only the true delta rebuilds,
#   4. capture a fresh baseline and publish it as `warmcache` for the NEXT run.
#
# Correctness is never at stake, only perf: a stale/missing baseline just means more rebuild
# (worst case a full cold build), never a wrong output. Demo: run once (cold, seeds), then push a
# one-line change to a LEAF project and run again -- the second run rebuilds ONLY that leaf.

name: $(Date:yyyyMMdd).$(Rev:r) BigBuild WarmCache Demo

trigger: none
pr: none

parameters:
- name: slnf
  type: string
  default: 'Compilers.slnf'
- name: buildArgs
  type: string
  # determinism flags are REQUIRED for cross-run byte-stability; marker-space off (vanilla bits).
  default: '-c Debug -p:ContinuousIntegrationBuild=true -p:DeterministicSourcePaths=true'
- name: sdkFingerprint
  type: string
  default: 'sdk-11.0.100-preview.6-stock'   # the lane key; bump if the toolchain changes

variables:
  - name: CacheStore
    value: $(Agent.TempDirectory)/wc-store
  - name: Scripts
    value: $(Build.SourcesDirectory)/eng/bigbuild-cache/scripts
  # suppress CodeQL auto-injection (this is a throwaway perf demo, not a shipping build)
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true

stages:
- stage: warmcache
  dependsOn: []
  jobs:
  - job: warmcache
    displayName: Warm-clone cache demo (Compilers.slnf)
    timeoutInMinutes: 150
    pool:
      name: NetCore1ESPool-Internal
      demands: ImageOverride -equals windows.vs2026.amd64
    steps:
    - checkout: self
      # Pin the checkout path so the absolute source path is identical run-to-run (path-stability).
      path: s
      clean: true
      fetchDepth: 0           # Select-Baseline walks first-parent history to the nearest cached ancestor

    - task: PowerShell@2
      displayName: Restore (bootstrap SDK + packages)
      inputs:
        filePath: eng/build.ps1
        arguments: -ci -restore -prepareMachine -solution ${{ parameters.slnf }} -binaryLogName Restore.binlog

    # Pull THIS branch's previous run's baseline. First run has none -> cold (continueOnError).
    - task: DownloadPipelineArtifact@2
      displayName: Pull last warmcache (this branch)
      continueOnError: true
      inputs:
        buildType: specific
        project: $(System.TeamProjectId)
        definition: $(System.DefinitionId)
        buildVersionToDownload: latestFromBranch
        # our seed/warm runs are partiallySucceeded (the cold-run download-skip), which latestFromBranch
        # excludes by default -> "No builds currently exist". Include them so the baseline is found.
        allowPartiallySucceededBuilds: true
        branchName: $(Build.SourceBranch)
        artifactName: warmcache
        targetPath: $(CacheStore)

    - task: PowerShell@2
      displayName: Seed from baseline (select + overlay + back-date)
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $store = "$(CacheStore)"
          $lane  = "roslyn-${{ parameters.sdkFingerprint }}-win"
          $laneDir = Join-Path $store $lane
          if (-not (Test-Path $laneDir)) {
            Write-Host "##[warning]No baseline for this branch yet -- COLD build (this run will seed one)."
            Write-Host "##vso[task.setvariable variable=Seeded]false"
            exit 0
          }
          $sel = & "$(Scripts)/Select-Baseline.ps1" -RepoRoot . -LaneDir $laneDir | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0 -or -not $sel) { Write-Host "##[warning]No ancestor baseline -- COLD build."; Write-Host "##vso[task.setvariable variable=Seeded]false"; exit 0 }
          Write-Host "==> seeding from $sel"
          & "$(Scripts)/Restore-Baseline.ps1" -RepoRoot . -BaselineDir $sel
          & "$(Scripts)/Replay-Baseline.ps1"  -RepoRoot . -BaselineDir $sel -Mode BackDate
          Write-Host "##vso[task.setvariable variable=SeededBaselineDir]$sel"
          Write-Host "##vso[task.setvariable variable=Seeded]true"

    - task: PowerShell@2
      displayName: Build Compilers.slnf (measure cold vs warm)
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          # Arcade refuses to overwrite an existing binlog, and the seed overlays the baseline's
          # artifacts/log (with its binlog) back in. Logs are per-run, not a cached output, so clear
          # the log dir before building. (Future baselines exclude log via -OutputRoots below.)
          Remove-Item -Recurse -Force "$(Build.SourcesDirectory)/artifacts/log" -ErrorAction SilentlyContinue
          # LEAN build: call the bootstrapped dotnet directly, NOT eng/build.ps1 -build. The arcade
          # wrapper adds ~150s of fixed overhead (toolset init + non-compile targets across every
          # project) that swamps the cache win. The earlier bare-build CS0518/CS0234 was only because
          # NUGET_PACKAGES did not point at the -ci restore location, so the ref packs were not found;
          # set it to $RepoRoot\.packages (what eng/build.ps1 -restore used) and use the same SDK.
          # No -restore, so a seeded run's back-dated obj is preserved.
          $env:NUGET_PACKAGES = "$(Build.SourcesDirectory)\.packages"
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          $dotnet = "$(Build.SourcesDirectory)\.dotnet\dotnet.exe"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & $dotnet build ${{ parameters.slnf }} -c Debug -p:ContinuousIntegrationBuild=true -p:DeterministicSourcePaths=true --no-restore -bl:"$(Build.SourcesDirectory)/artifacts/log/Build.WarmCache.binlog"
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }
          $sw.Stop()
          Write-Host ("##[section]Build finished in {0:n1}s (seeded=$(Seeded))" -f $sw.Elapsed.TotalSeconds)
          Write-Host ("##vso[task.setvariable variable=BuildSeconds]{0:n1}" -f $sw.Elapsed.TotalSeconds)

    - task: PowerShell@2
      displayName: Capture fresh baseline
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $store = "$(CacheStore)"
          $lane  = "roslyn-${{ parameters.sdkFingerprint }}-win"
          $sha   = (git rev-parse HEAD).Trim()
          $baselineDir = Join-Path (Join-Path $store $lane) $sha
          # Build capture args as a hashtable and splat it: array-splat passes values positionally,
          # so an optional -PriorBaselineDir only binds by name via a hashtable. Cache only the real
          # outputs (bin, obj); exclude log/tmp/TestResults (transient; log trips arcade's binlog guard).
          $capArgs = @{ RepoRoot = '.'; BaselineDir = $baselineDir; OutputRoots = @('artifacts\bin', 'artifacts\obj'); Archive = $true }
          # Stat-cache: stash the seeded baseline's outputs.clixml before wiping the store so Capture
          # can reuse the Sha of any output the build did not rewrite. Read the seeded dir via env (a
          # cold-run $(...) macro is undefined and would be mis-evaluated). Cold -> just hash all.
          $seeded = $env:SEEDEDBASELINEDIR
          if ($seeded -and (Test-Path (Join-Path $seeded 'outputs.clixml'))) {
            $stash = Join-Path "$(Agent.TempDirectory)" 'prior-baseline'
            New-Item -ItemType Directory -Force $stash | Out-Null
            Copy-Item (Join-Path $seeded 'outputs.clixml') (Join-Path $stash 'outputs.clixml') -Force
            $capArgs['PriorBaselineDir'] = $stash
          }
          # Keep only the current baseline in the published store (one baseline, not growing).
          if (Test-Path $store) { Remove-Item $store -Recurse -Force }
          & "$(Scripts)/Capture-Baseline.ps1" @capArgs
          Write-Host "==> captured baseline -> $baselineDir"

    - task: PublishPipelineArtifact@1
      displayName: Publish warmcache (for next run)
      inputs:
        targetPath: $(CacheStore)
        artifactName: warmcache

    - task: PublishPipelineArtifact@1
      displayName: Publish binlogs
      condition: succeededOrFailed()
      inputs:
        targetPath: $(Build.SourcesDirectory)/artifacts/log
        artifactName: binlogs
