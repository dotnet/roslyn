trigger: none
pr: none

variables:
  - name: HistoricalSourceBuildId
    value: ${{ parameters.SourceBuildId }}
  - name: ReplaySequence
    value: ${{ parameters.ReplaySequence }}
  - name: ReplayExperimentId
    value: ${{ parameters.ReplayExperimentId }}
  - name: TestSkipStoreGeneration
    value: ${{ parameters.TestSkipStoreGeneration }}
  - name: ForceTests
    value: ${{ parameters.ForceTests }}
  - name: SingleMachineTestTimeoutMinutes
    value: ${{ parameters.SingleMachineTestTimeoutMinutes }}
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true
  - name: PoolName
    value: NetCore-Public
  - name: Vs2026PreviewQueueName
    value: windows.vs2026preview.scout.amd64.open
  - name: UbuntuQueueName
    value: Build.Ubuntu.2204.Amd64.Open
  - name: WindowsQueueName
    value: 1es-windows-2022-open
  - name: HelixWindowsQueueName
    value: Windows.10.Amd64.Open
  - name: HelixWindowsVsQueueName
    value: windows.amd64.vs2026.pre.scout.open
  - name: HelixWindowsSpanishQueueName
    value: Windows.10.Amd64.Server2022.ES.Open
  - name: HelixMacOsQueueName
    value: OSX.15.Amd64.Open

parameters:
  - name: SourceBuildId
    type: number
    default: 0
  - name: ReplaySequence
    type: number
    default: 0
  - name: ReplayExperimentId
    type: string
    default: 'roslyn-history-testskip-20260904-10'
  - name: TestSkipStoreGeneration
    type: string
    default: 'hist0904'
  - name: ForceTests
    type: boolean
    default: false
  - name: SingleMachineTestTimeoutMinutes
    type: number
    default: 90
  - name: ubuntuPool
    type: object
    default:
      name: $(PoolName)
      demands: ImageOverride -equals $(UbuntuQueueName)
  - name: windowsPool
    type: object
    default:
      name: $(PoolName)
      demands: ImageOverride -equals $(WindowsQueueName)
  - name: vs2026PreviewPool
    type: object
    default:
      name: $(PoolName)
      demands: ImageOverride -equals $(Vs2026PreviewQueueName)

stages:
- stage: Patched_RunTests
  jobs:
  - job: Build_Patched_RunTests
    displayName: Build result-gated RunTests
    pool: ${{ parameters.vs2026PreviewPool }}
    timeoutInMinutes: 30
    variables:
      - template: eng/pipelines/variables-build.yml
        parameters:
          configuration: Release
    steps:
      - template: eng/pipelines/checkout-windows-task.yml

      - task: PowerShell@2
        displayName: Validate replay parameters
        inputs:
          targetType: inline
          pwsh: true
          script: |
            if (${{ parameters.SourceBuildId }} -le 0) { throw 'SourceBuildId is required.' }
            if ('${{ parameters.TestSkipStoreGeneration }}' -notmatch '^[A-Za-z0-9._-]+$') {
              throw 'TestSkipStoreGeneration contains unsafe artifact-name characters.'
            }
            Write-Host "Sequence ${{ parameters.ReplaySequence }} source build ${{ parameters.SourceBuildId }}"
            Write-Host "Experiment ${{ parameters.ReplayExperimentId }} forceTests=${{ parameters.ForceTests }}"

      - task: PowerShell@2
        displayName: Build patched RunTests
        inputs:
          filePath: eng/build.ps1
          arguments: -configuration Release -prepareMachine -ci -restore -build
            -solution src/Tools/RunTests/RunTests.csproj -msbuildEngine dotnet
            -binaryLogName PatchedRunTests.binlog

      - task: PowerShell@2
        displayName: Stage patched RunTests
        inputs:
          targetType: inline
          pwsh: true
          script: |
            $source = "$(Build.SourcesDirectory)\artifacts\bin\RunTests\Release\net10.0\RunTests.dll"
            $target = "$(Build.ArtifactStagingDirectory)\patched-runtests"
            if (-not (Test-Path $source)) { throw "Patched RunTests not found at $source" }
            New-Item -ItemType Directory -Force $target | Out-Null
            Copy-Item $source (Join-Path $target 'RunTests.dll') -Force

      - task: PublishPipelineArtifact@1
        displayName: Publish patched RunTests
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)\patched-runtests
          artifactName: patched-runtests

- stage: Windows_Debug_Desktop
  dependsOn: Patched_RunTests
  jobs:
  - template: eng/pipelines/test-windows-job.yml
    parameters:
      testRunName: 'Test Windows Desktop Debug 32'
      jobName: Test_Windows_Desktop_Debug_32
      testArtifactName: Transport_Artifacts_Windows_Debug
      configuration: Debug
      testArguments: -testDesktop -testArch x86
      helixQueueName: $(HelixWindowsVsQueueName)
      helixApiAccessToken: ''
      poolParameters: ${{ parameters.windowsPool }}

  - template: eng/pipelines/test-windows-job.yml
    parameters:
      testRunName: 'Test Windows Desktop Debug 64'
      jobName: Test_Windows_Desktop_Debug_64
      testArtifactName: Transport_Artifacts_Windows_Debug
      configuration: Debug
      testArguments: -testDesktop -testArch x64
      helixQueueName: $(HelixWindowsVsQueueName)
      helixApiAccessToken: ''
      poolParameters: ${{ parameters.windowsPool }}

- stage: Windows_Release_Desktop
  dependsOn: Patched_RunTests
  jobs:
  - template: eng/pipelines/test-windows-job.yml
    parameters:
      testRunName: 'Test Windows Desktop Release 32'
      jobName: Test_Windows_Desktop_Release_32
      testArtifactName: Transport_Artifacts_Windows_Release
      configuration: Release
      testArguments: -testDesktop -testArch x86
      helixQueueName: $(HelixWindowsVsQueueName)
      helixApiAccessToken: ''
      poolParameters: ${{ parameters.windowsPool }}

  - template: eng/pipelines/test-windows-job.yml
    parameters:
      testRunName: 'Test Windows Desktop Release 64'
      jobName: Test_Windows_Desktop_Release_64
      testArtifactName: Transport_Artifacts_Windows_Release
      configuration: Release
      testArguments: -testDesktop -testArch x64
      helixQueueName: $(HelixWindowsVsQueueName)
      helixApiAccessToken: ''
      poolParameters: ${{ parameters.windowsPool }}

  - template: eng/pipelines/test-windows-job.yml
    parameters:
      testRunName: 'Test Windows Desktop Spanish Release 64'
      jobName: Test_Windows_Desktop_Spanish_Release_64
      testArtifactName: Transport_Artifacts_Windows_Release
      configuration: Release
      testArguments: -testDesktop -testArch x64
      helixQueueName: $(HelixWindowsSpanishQueueName)
      helixApiAccessToken: ''
      poolParameters: ${{ parameters.windowsPool }}

- stage: Windows_Debug_CoreClr
  dependsOn: Patched_RunTests
  jobs:
  - template: eng/pipelines/test-windows-job.yml
    parameters:
      testRunName: 'Test Windows CoreClr Debug'
      jobName: Test_Windows_CoreClr_Debug
      testArtifactName: Transport_Artifacts_Windows_Debug
      configuration: Debug
      testArguments: -testCoreClr
      helixQueueName: $(HelixWindowsQueueName)
      helixApiAccessToken: ''
      poolParameters: ${{ parameters.windowsPool }}

  - template: eng/pipelines/test-windows-job.yml
    parameters:
      testRunName: 'Test Windows CoreClr Debug Spanish'
      jobName: Test_Windows_CoreClr_Debug_Spanish
      testArtifactName: Transport_Artifacts_Windows_Debug
      configuration: Debug
      testArguments: -testCoreClr
      helixQueueName: $(HelixWindowsSpanishQueueName)
      helixApiAccessToken: ''
