# Roslyn VS integration test gate pipeline for real-signed Visual Studio builds.

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: VisualStudioBuildUnderTest
    source: DD-CB-ReleaseVS
    trigger: true
  repositories:
  - repository: DartLab
    type: git
    name: DevDiv/DartLab
    ref: refs/tags/Production
  - repository: DartLabTemplates
    type: git
    name: DevDiv/DartLab
    ref: refs/tags/Production
  - repository: VSTemplates
    type: git
    name: DevDiv/VS.Templates
    ref: refs/heads/main
  - repository: RoslynMirror
    endpoint: dnceng-internal-code-access
    type: git
    name: internal/dotnet-roslyn
    ref: refs/heads/main
    #ref: $(Build.SourceBranch) # revert

parameters:
  - name: prNumber
    type: string
    default: 'None'
  - name: sha
    type: string
    default: 'None'
  - name: EnforceLatestCommit
    type: boolean
    default: true
  - name: visualStudioBootstrapperURI
    type: string
    default: '(default)'
  - name: testCaseFilter
    type: string
    default: '(all)'
  - name: skipCustomRoslynDeploy
    type: boolean
    default: false
  - name: testsCommitHash
    type: string
    default: '(default)'
  - name: testsCommitFromVisualStudioBuild
    type: boolean
    default: false
  - name: testMachineLab
    displayName: CloudTest Lab (required for migration validation)
    type: string
    default: Roslyn
  - name: testMachineHoldStrategy
    displayName: Test Machine Hold Strategy
    type: string
    default: None
    values:
    - None
    - Completion
    - Execution
    - Failure
    - Timeout

extends:
  template: /DartLab/1ES/pipelines/ci/build.yml@VSTemplates
  parameters:
    dartLabTemplatesRepositoryAlias: DartLab
    testStages:
    - template: /eng/pipelines/test-gates/staging/stages.yml@self
      parameters:
        prNumber: ${{ parameters.prNumber }}
        sha: ${{ parameters.sha }}
        EnforceLatestCommit: ${{ parameters.EnforceLatestCommit }}
        visualStudioBootstrapperURI: ${{ parameters.visualStudioBootstrapperURI }}
        testCaseFilter: ${{ parameters.testCaseFilter }}
        skipCustomRoslynDeploy: ${{ parameters.skipCustomRoslynDeploy }}
        testsCommitHash: ${{ parameters.testsCommitHash }}
        testsCommitFromVisualStudioBuild: ${{ parameters.testsCommitFromVisualStudioBuild }}
        testMachineLab: ${{ parameters.testMachineLab }}
        testMachineHoldStrategy: ${{ parameters.testMachineHoldStrategy }}
