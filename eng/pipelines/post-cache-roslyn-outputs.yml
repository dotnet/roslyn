parameters:
- name: configuration
  type: string
  default: 'Debug'

steps:
  - task: PowerShell@2
    displayName: Show and Purge Roslyn Output Cache
    inputs:
      targetType: 'inline'
      script: |
        function Write-AzureDevOpsWarning([string] $message) {
          Write-Host "##vso[task.logissue type=warning]$message"
        }

        $buildStart = "$(RoslynCompilerCacheBuildStartTime)"
        if ([string]::IsNullOrWhiteSpace($buildStart)) {
          Write-AzureDevOpsWarning "Roslyn compiler cache build start time was not recorded. Skipping cache stats and purge."
          exit 0
        }

        # Some jobs (such as the Windows integration test build) only produce the net472 compiler server.
        $compilerServerDirectory = [System.IO.Path]::Combine("$(Build.SourcesDirectory)", "artifacts", "bin", "VBCSCompiler", "${{ parameters.configuration }}")
        $coreCompilerServerPath = [System.IO.Path]::Combine($compilerServerDirectory, "net10.0", "VBCSCompiler.dll")
        $frameworkCompilerServerPath = [System.IO.Path]::Combine($compilerServerDirectory, "net472", "VBCSCompiler.exe")
        if (Test-Path -LiteralPath $coreCompilerServerPath) {
          $compilerServerExecutable = "dotnet"
          $compilerServerArguments = @("exec", $coreCompilerServerPath)
        } elseif (Test-Path -LiteralPath $frameworkCompilerServerPath) {
          $compilerServerExecutable = $frameworkCompilerServerPath
          $compilerServerArguments = @()
        } else {
          Write-AzureDevOpsWarning "VBCSCompiler was not found at '$coreCompilerServerPath' or '$frameworkCompilerServerPath'. Skipping cache stats and purge."
          exit 0
        }

        $cachePath = "$(ROSLYN_CACHE_PATH)"
        if ([string]::IsNullOrWhiteSpace($cachePath)) {
          Write-AzureDevOpsWarning "Roslyn compiler cache path was not set. Skipping cache stats and purge."
          exit 0
        }

        if (-not (Test-Path -LiteralPath $cachePath)) {
          Write-AzureDevOpsWarning "Roslyn compiler cache path does not exist: $cachePath"
          exit 0
        }

        Write-Host "Roslyn compiler cache stats since build start ($buildStart):"
        & $compilerServerExecutable @compilerServerArguments "-cachepath:$cachePath" "-cachestats:$buildStart" "-cachestatsverbosity:1"
        if ($LASTEXITCODE -ne 0) {
          Write-AzureDevOpsWarning "Failed to show Roslyn compiler cache stats. Exit code: $LASTEXITCODE"
        }

        Write-Host "Purging Roslyn compiler cache entries unused since build start ($buildStart):"
        & $compilerServerExecutable @compilerServerArguments "-cachepath:$cachePath" "-purgecache:$buildStart"
        if ($LASTEXITCODE -ne 0) {
          Write-AzureDevOpsWarning "Failed to purge Roslyn compiler cache. Exit code: $LASTEXITCODE"
        }

        exit 0
    continueOnError: true
    condition: succeededOrFailed()