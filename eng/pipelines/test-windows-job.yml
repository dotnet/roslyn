# Test on Windows Desktop using Helix
parameters:
- name: helixQueueName
  type: string
- name: testRunName
  type: string
  default: ''
- name: jobName
  type: string
  default: ''
- name: testArtifactName
  type: string
  default: ''
- name: configuration
  type: string
  default: 'Debug'
- name: testArguments
  type: string
  default: ''
- name: diagnosticAssembly
  type: string
  default: ''
- name: diagnosticTestMethod
  type: string
  default: ''
- name: ilasmDiagnostic
  type: boolean
  default: false
- name: injectTestFailure
  type: boolean
  default: false
- name: helixApiAccessToken
  type: string
  default: ''
- name: poolParameters
  type: object

jobs:
- job: ${{ parameters.jobName }}
  pool: ${{ parameters.poolParameters }}
  timeoutInMinutes: 360
  steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: Download Test Payload
      inputs:
        buildType: current
        artifactName: ${{ parameters.testArtifactName }}
        targetPath: '$(Build.SourcesDirectory)'

    - task: DownloadPipelineArtifact@2
      displayName: Download patched RunTests
      inputs:
        buildType: current
        artifactName: patched-runtests
        targetPath: $(Pipeline.Workspace)\patched-runtests

    - task: PowerShell@2
      displayName: Overlay patched RunTests
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $source = Get-ChildItem "$(Pipeline.Workspace)\patched-runtests" -Recurse -Filter RunTests.dll |
            Select-Object -First 1 -ExpandProperty FullName
          $target = "$(Build.SourcesDirectory)\artifacts\bin\RunTests\${{ parameters.configuration }}\net10.0\RunTests.dll"
          if (-not $source -or -not (Test-Path $target)) { throw "RunTests overlay path missing: source=$source target=$target" }
          Copy-Item $source $target -Force

    - task: BatchScript@1
      displayName: Rehydrate RunTests
      inputs:
        filename: ./artifacts/bin/RunTests/${{ parameters.configuration }}/net10.0/rehydrate.cmd
      env:
        HELIX_CORRELATION_PAYLOAD: '$(Build.SourcesDirectory)\.duplicate'

    # Pull this leg's closure-fingerprint PASS store from the most recent build on the branch. A leg
    # only skips an assembly whose full deploy closure has a recorded PASS under this same leg. Missing
    # on the first run (nothing to download) -> everything runs, so continueOnError is intentional.
    - task: DownloadPipelineArtifact@2
      displayName: Pull test-skip store
      continueOnError: true
      inputs:
        buildType: specific
        project: $(System.TeamProject)
        definition: $(System.DefinitionId)
        buildVersionToDownload: latestFromBranch
        branchName: $(Build.SourceBranch)
        allowPartiallySucceededBuilds: true
        allowFailedBuilds: true
        artifact: testskip-$(TestSkipStoreGeneration)-${{ parameters.jobName }}
        path: $(Agent.TempDirectory)/testskipstore

    - task: PowerShell@2
      displayName: Run Unit Tests
      inputs:
        filePath: eng/build.ps1
        ${{ if ne(variables['System.TeamProject'], 'public') }}:
          arguments: -ci -helix -configuration ${{ parameters.configuration }} -helixQueueName ${{ parameters.helixQueueName }} -helixApiAccessToken ${{ parameters.helixApiAccessToken }} ${{ parameters.testArguments }} -collectDumps
        ${{ else }}:
          arguments: -ci -helix -configuration ${{ parameters.configuration }} -helixQueueName ${{ parameters.helixQueueName }} ${{ parameters.testArguments }} -collectDumps
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        ROSLYN_TEST_SKIP_STORE: $(Agent.TempDirectory)/testskipstore
        ROSLYN_TEST_SKIP_FORCE_RUN: $(ForceTests)
        ROSLYN_TEST_SKIP_DIAGNOSTIC_ASSEMBLY: ${{ parameters.diagnosticAssembly }}
        ROSLYN_TEST_SKIP_DIAGNOSTIC_TEST_METHOD: ${{ parameters.diagnosticTestMethod }}
        ROSLYN_TEST_SKIP_INJECT_FAILURE: ${{ parameters.injectTestFailure }}
        ROSLYN_TEST_SKIP_ILASM_DIAGNOSTIC: ${{ parameters.ilasmDiagnostic }}

    # Persist the updated PASS store only when the whole leg (tests included) was green. This is the
    # authoritative soundness gate: a failed leg publishes nothing, so its assemblies re-run next time.
    - task: PublishPipelineArtifact@1
      displayName: Publish test-skip store
      condition: succeeded()
      inputs:
        targetPath: $(Agent.TempDirectory)/testskipstore
        artifact: testskip-$(TestSkipStoreGeneration)-${{ parameters.jobName }}

    - template: publish-logs.yml
      parameters:
        configuration: ${{ parameters.configuration }}
        jobName: ${{ parameters.jobName }}
        testRunName: ${{ parameters.testRunName }}
