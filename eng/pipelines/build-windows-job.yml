# Build on windows desktop
parameters:
- name: jobName
  type: string
  default: ''
- name: testArtifactName
  type: string
  default: ''
- name: configuration
  type: string
  default: 'Debug'
- name: poolParameters
  type: object
- name: restoreArguments
  type: string
  default: ''
- name: buildArguments
  type: string
  default: ''
- name: prepareNuGetPackageUpgradePayload
  type: boolean
  default: false

jobs:
- job: ${{ parameters.jobName }}
  pool: ${{ parameters.poolParameters }}
  timeoutInMinutes: 40
  variables:
    - template: variables-build.yml
      parameters:
        configuration: ${{ parameters.configuration }}
    - name: artifactName
      value: ${{ parameters.testArtifactName }}
    - name: ROSLYN_CACHE_PATH
      value: $(Agent.TempDirectory)/roslyn-cache

  steps:
    - template: checkout-windows-task.yml

    - task: PowerShell@2
      displayName: Restore
      inputs:
        filePath: eng/build.ps1
        arguments: -configuration ${{ parameters.configuration }} -prepareMachine -ci -restore -binaryLogName Restore.binlog ${{ parameters.restoreArguments }}

    - template: cache-roslyn-outputs.yml
      parameters:
        configuration: ${{ parameters.configuration }}

    - task: PowerShell@2
      displayName: Build
      inputs:
        filePath: eng/build.ps1
        arguments: -configuration ${{ parameters.configuration }} -prepareMachine -ci -build ${{ iif(eq(parameters.prepareNuGetPackageUpgradePayload, true), '-pack', '') }} -binaryLogName Build.binlog -skipDocumentation ${{ parameters.buildArguments }}

    - template: post-cache-roslyn-outputs.yml
      parameters:
        configuration: ${{ parameters.configuration }}

    - ${{ if eq(parameters.prepareNuGetPackageUpgradePayload, true) }}:
      - task: PowerShell@2
        displayName: Prepare NuGet Package Upgrade Payload
        inputs:
          filePath: eng/prepare-nuget-package-upgrade-payload.ps1
          arguments: -PackageDirectory '$(Build.SourcesDirectory)\artifacts\packages\${{ parameters.configuration }}\Shipping' -OutputDirectory '$(Build.SourcesDirectory)\artifacts\packageValidation\${{ parameters.configuration }}'

      - task: PublishPipelineArtifact@1
        displayName: Publish NuGet Package Upgrade Payload
        inputs:
          targetPath: '$(Build.SourcesDirectory)\artifacts\packageValidation\${{ parameters.configuration }}'
          artifactName: Roslyn_NuGet_Packages_${{ parameters.configuration }}

    - task: PowerShell@2
      displayName: Prepare Unit Tests
      inputs:
        filePath: eng/prepare-tests.ps1
        arguments: -configuration ${{ parameters.configuration }}
      condition: and(ne(variables['artifactName'], ''), succeeded())

    - task: PublishPipelineArtifact@1
      displayName: Publish Test Payload
      inputs:
        targetPath: '$(Build.SourcesDirectory)\artifacts\testPayload'
        artifactName: ${{ parameters.testArtifactName }}
      condition: and(ne(variables['artifactName'], ''), succeeded())

    - template: publish-logs.yml
      parameters:
        configuration: ${{ parameters.configuration }}
        jobName: ${{ parameters.jobName }}
