# Test on Unix using Helix
parameters:
- name: helixQueueName
  type: string
- name: testRunName
  type: string
  default: ''
- name: jobName
  type: string
  default: ''
- name: testArtifactName
  type: string
  default: ''
- name: configuration
  type: string
  default: 'Debug'
- name: testArguments
  type: string
  default: ''
- name: helixApiAccessToken
  type: string
  default: ''
- name: poolParameters
  type: object

jobs:
- job: ${{ parameters.jobName }}
  pool: ${{ parameters.poolParameters }}
  timeoutInMinutes: 360
  steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: Download Test Payload
      inputs:
        artifact: ${{ parameters.testArtifactName }}
        path: '$(Build.SourcesDirectory)'
    
    - task: ShellScript@2
      displayName: Rehydrate RunTests
      inputs:
        scriptPath: ./artifacts/bin/RunTests/${{ parameters.configuration }}/net10.0/rehydrate.sh
      env:
        HELIX_CORRELATION_PAYLOAD: '$(Build.SourcesDirectory)/.duplicate'

    # Pull this leg's closure-fingerprint PASS store from the most recent build on the branch. A leg
    # only skips an assembly whose full deploy closure has a recorded PASS under this same leg. Missing
    # on the first run (nothing to download) -> everything runs, so continueOnError is intentional.
    - task: DownloadPipelineArtifact@2
      displayName: Pull test-skip store
      continueOnError: true
      inputs:
        buildType: specific
        project: $(System.TeamProject)
        definition: $(System.DefinitionId)
        buildVersionToDownload: latestFromBranch
        branchName: $(Build.SourceBranch)
        allowPartiallySucceededBuilds: true
        allowFailedBuilds: true
        artifact: testskipstore-${{ parameters.jobName }}
        path: $(Agent.TempDirectory)/testskipstore

    - task: ShellScript@2
      inputs:
        scriptPath: ./eng/build.sh        
        ${{ if ne(variables['System.TeamProject'], 'public') }}:
          args: --ci --helix --configuration ${{ parameters.configuration }} --helixQueueName ${{ parameters.helixQueueName }} --helixApiAccessToken ${{ parameters.helixApiAccessToken }} ${{ parameters.testArguments }}        
        ${{ else }}:
          args: --ci --helix --configuration ${{ parameters.configuration }} --helixQueueName ${{ parameters.helixQueueName }} ${{ parameters.testArguments }}
      displayName: Test
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        ROSLYN_TEST_SKIP_STORE: $(Agent.TempDirectory)/testskipstore

    # Persist the updated PASS store only when the whole leg (tests included) was green. This is the
    # authoritative soundness gate: a failed leg publishes nothing, so its assemblies re-run next time.
    - task: PublishPipelineArtifact@1
      displayName: Publish test-skip store
      condition: succeeded()
      inputs:
        targetPath: $(Agent.TempDirectory)/testskipstore
        artifact: testskipstore-${{ parameters.jobName }}

    - template: publish-logs.yml
      parameters:
        configuration: ${{ parameters.configuration }}
        jobName: ${{ parameters.jobName }}
        testRunName: ${{ parameters.testRunName }}
