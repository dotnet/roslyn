trigger:
  branches:
    include:
      - main
      - main-vs-deps
      - release/dev15.9.x
      - release/dev16.*-vs-deps
      - release/dev17.*
    exclude:
      - release/dev17.0
pr: none

resources:
  repositories:
  - repository: MicroBuildTemplate
    type: git
    name: 1ESPipelineTemplates/MicroBuildTemplate
    ref: refs/tags/release

parameters:
  - name: IbcDrop
    type: string
    default: default

  - name: SignType
    default: real
    type: string
    values:
      - real
      - test

  - name: SkipApplyOptimizationData
    type: boolean
    default: false

  - name: SkipTests
    type: boolean
    default: true

  - name: PMEOverride
    type: boolean
    default: false

schedules:
  - cron: "0 8 22-28 * 0"
    displayName: "Monthly smoke test"
    branches:
      include:
        - main
        - release/*
      exclude:
        - ""
    always: true # Run even if there have been no source code changes since the last successful scheduled run
    batch: false # Do not run the pipeline if the previously scheduled run is in-progress

variables:
  - group: DotNet-Roslyn-SDLValidation-Params
  - name: Codeql.Enabled
    value: true

  # To retrieve OptProf data we need to authenticate to the VS drop storage.
  # DevDiv drop access token is acquired via WIF service connection (dnceng-devdiv-drop-rw-code-rw-wif)
  # Get $AccessToken-dotnet-build-bot-public-repo from DotNet-Versions-Publish
  - group: DotNet-Versions-Publish
  - group: DotNet-DevDiv-Insertion-Workflow-Variables
  - group: AzureDevOps-Artifact-Feeds-Pats
  # Populated at runtime by the 'Get DevDiv Drop Access Token' AzureCLI@2 step
  # (WIF service connection dnceng-devdiv-drop-rw-code-rw-wif). See dotnet/roslyn#83726.
  - name: _DevDivDropAccessToken
    value: ''
  - name: ArtifactServices.Drop.PAT
    value: ''
  - group: AzureDevOps-Artifact-Feeds-Pats

  - name: BuildConfiguration
    value: release
  - name: Roslyn.GitHubEmail
    value: dotnet-build-bot@microsoft.com
  - name: Roslyn.GitHubToken
    value: $(AccessToken-dotnet-build-bot-public-repo)
  - name: Roslyn.GitHubUserName
    value: dotnet-build-bot

  - name: Insertion.InsertToolset
    value: true
  - name: Insertion.CreateDraftPR
    value: true
  - name: Insertion.TitlePrefix
    value: "[Auto Insertion]"
  - name: Insertion.TitleSuffix
    value: ""
  - name: VisualStudio.DropName
    value: "Products/$(System.TeamProject)/$(Build.Repository.Name)/$(Build.SourceBranchName)/$(Build.BuildNumber)"

  - ${{ if and(notin(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
      - name: enableSourceIndex
        value: true

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@MicroBuildTemplate
  parameters:
    featureFlags:
      autoBaseline: true
    sdl:
      sourceAnalysisPool:
        name: NetCore1ESPool-Svc-Internal
        image: 1es-windows-2022
        os: windows
      sbom:
        enabled: false
      suppression:
        suppressionFile: $(Build.SourcesDirectory)\eng\config\guardian\.gdnsuppres
      policheck:
        enabled: true
      tsa:
        enabled: true
        configFile: "$(Build.SourcesDirectory)/eng/TSAConfig.gdntsa"
    pool:
      name: NetCore1ESPool-Svc-Internal
      image: windows.vs2017.amd64
      os: windows
    customBuildTags:
      - ES365AIMigrationTooling
    stages:
      - stage: build
        displayName: Build and Test

        jobs:
          - job: OfficialBuild
            displayName: Official Build
            timeoutInMinutes: 360
            templateContext:
              outputParentDirectory: $(Build.ArtifactStagingDirectory)
              outputs:
                - output: pipelineArtifact
                  displayName: 'Publish Build Logs'
                  condition: succeededOrFailed()
                  targetPath: '$(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)\logs'
                  artifactName: ReleaseBuildLogs_Attempt$(System.JobAttempt)
                  artifactType: container
                  sbomEnabled: false

                - output: pipelineArtifact
                  displayName: Publish Symbols artifacts
                  condition: succeededOrFailed()
                  targetPath: $(Build.ArtifactStagingDirectory)\symbols
                  artifactName: ReleaseSymbols
                  artifactType: container
                  sbomEnabled: false

                - output: pipelineArtifact
                  displayName: Publish NuGet Packages as Artifact
                  targetPath: $(Build.ArtifactStagingDirectory)\Packages
                  artifactName: ReleasePackages
                  artifactType: container
                  sbomEnabled: false

                - output: pipelineArtifact
                  displayName: Publish Insertion Parameters
                  targetPath: $(Build.ArtifactStagingDirectory)\Insertion
                  artifactName: InsertionParameters
                  artifactType: container
                  sbomEnabled: false

            steps:
              - task: NuGetToolInstaller@1
                displayName: 'Use NuGet 6.2.4'
                inputs:
                  versionSpec: 6.2.4

              # Authenticate to azure-public/vs-impl feed via WIF service connection
              - task: NuGetAuthenticate@1
                inputs:
                  azureDevOpsServiceConnection: dnceng-azure-public-vs-impl-push
                  feedUrl: https://pkgs.dev.azure.com/azure-public/vside/_packaging/vs-impl/nuget/v3/index.json

              # Authenticate to azure-public/vssdk feed via WIF service connection
              - task: NuGetAuthenticate@1
                inputs:
                  azureDevOpsServiceConnection: dnceng-azure-public-vs-impl-push
                  feedUrl: https://pkgs.dev.azure.com/azure-public/vside/_packaging/vssdk/nuget/v3/index.json

              # Authenticate to DevDiv feeds (still using PAT-based service connections)
              - task: NuGetAuthenticate@1
                inputs:
                  nuGetServiceConnections: devdiv/engineering, devdiv/dotnet-core-internal-tooling

              # Authenticate to DevDiv VS (CoreXT) feed via WIF service connection
              - task: NuGetAuthenticate@1
                inputs:
                  azureDevOpsServiceConnection: dnceng-devdiv-vs-feed-push
                  feedUrl: https://pkgs.dev.azure.com/devdiv/_packaging/VS/nuget/v3/index.json

              - task: NuGetCommand@2
                inputs:
                  command: custom
                  arguments: 'locals all -clear'

              - task: UseDotNet@2
                displayName: 'Use .NET Core sdk'
                inputs:
                  packageType: sdk
                  useGlobalJson: true
                  workingDirectory: '$(Build.SourcesDirectory)'

              - task: NuGetCommand@2
                displayName: 'NuGet restore'
                inputs:
                  nugetConfigPath: 'NuGet.Config'
                  feedsToUse: 'config'
                  restoreSolution: 'build\ToolsetPackages\InternalToolset.csproj'

              - task: MicroBuildSigningPlugin@4
                inputs:
                  signType: ${{ parameters.SignType }}
                  zipSources: false
                  feedSource: https://dnceng.pkgs.visualstudio.com/_packaging/MicroBuildToolset/nuget/v3/index.json
                  # Set ConnectedPMEServiceName if the build is a CI build, otherwise it is not needed
                  ${{ if or(eq(variables['Build.Reason'], 'IndividualCI'), eq(variables['Build.Reason'], 'Schedule'), parameters.PMEOverride) }}:
                     ConnectedPMEServiceName: 248d384a-b39b-46e3-8ad5-c2c210d5e7ca
                condition: and(succeeded(), in('${{ parameters.SignType }}', 'test', 'real'))

              - task: MicroBuildSwixPlugin@4
                inputs:
                  dropName: $(VisualStudio.DropName)
                  AccessToken: '$(System.AccessToken)'
                  feedSource: 'https://pkgs.dev.azure.com/dnceng/_packaging/MicroBuildToolset/nuget/v3/index.json'

              - task: VSBuild@1
                inputs:
                  solution: 'src/Tools/MicroBuild/Build.proj'
                  vsVersion: '15.0'
                  msbuildArgs: >- 
                          /p:TreatWarningsAsErrors=true 
                          /p:DeployExtension=false 
                          /p:TrackFileAccess=false
                          /p:OfficialBuild=true 
                          /p:VisualStudioVersion=14.0 
                          /flp1:Summary;Verbosity=diagnostic;Encoding=UTF-8;LogFile=$(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)\Roslyn.log 
                          /flp2:WarningsOnly;Verbosity=diagnostic;Encoding=UTF-8;LogFile=$(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)\Roslyn.wrn 
                          /flp3:ErrorsOnly;Verbosity=diagnostic;Encoding=UTF-8;LogFile=$(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)\Roslyn.err 
                          /p:RoslynMyGetApiKey=$(Roslyn.MyGetApiKey) 
                          /p:RoslynNuGetApiKey=$(Roslyn.NuGetApiKey) 
                          /p:RoslynGitHubEmail=$(Roslyn.GitHubEmail) 
                          /p:RoslynGitHubToken=$(Roslyn.GitHubToken) 
                          /p:RoslynGitHubUserName=$(Roslyn.GitHubUserName) 
                          /p:PB_PublishBlobFeedKey=$(PB_PublishBlobFeedKey) 
                          /p:PB_SkipTests=${{ parameters.SkipTests }}
                          /p:PB_SignType=${{ parameters.SignType }}
                          /p:PublishStableVersions=false 
                          /p:VersionStampToPublish=prerelease
                  platform: '$(BuildPlatform)'
                  configuration: '$(BuildConfiguration)'
                  maximumCpuCount: true
                  logProjectEvents: false

              - task: PublishTestResults@2
                displayName: Publish xUnit Test Results
                inputs:
                  testRunner: XUnit
                  testResultsFiles: '**/xUnitResults/*.xml'
                  mergeTestResults: true
                  testRunTitle: 'Unit Tests'
                condition: and(succeededOrFailed(), ${{ not(parameters.SkipTests) }})

              - task: CopyFiles@2
                displayName: 'Collect Built Symbols from $(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)'
                inputs:
                  SourceFolder: '$(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)'
                  Contents: '**\*.pdb'
                  TargetFolder: '$(Build.ArtifactStagingDirectory)\symbols'
                  FlattenFolders: true
                condition: succeeded()

              - task: PublishSymbols@2
                inputs:
                  SymbolsFolder: '$(Build.ArtifactStagingDirectory)\symbols'
                  SearchPattern: '**/*.pdb'
                  IndexSources: false
                  SymbolServerType: TeamServices
                displayName: Publish symbols to symbol server
                condition: and(succeeded(), eq(variables['SignType'], 'Real'))

              - task: CopyFiles@2
                displayName: 'Collect Built Packages from $(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)'
                inputs:
                  SourceFolder: '$(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)'
                  Contents: '**\*.nupkg'
                  TargetFolder: '$(Build.ArtifactStagingDirectory)\packages'
                  FlattenFolders: true
                condition: succeeded()

              # Publish insertion packages to CoreXT store (DevDiv/VS feed)
              # Uses ambient credentials from NuGetAuthenticate@1 above
              - task: PowerShell@2
                displayName: 'Publish CoreXT Packages'
                condition: succeeded()
                inputs:
                  targetType: inline
                  script: |
                    $feedUrl = "https://pkgs.dev.azure.com/devdiv/_packaging/VS/nuget/v3/index.json"
                    $packages = Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)\packages" -Recurse -Filter "*.nupkg" | Where-Object { $_.Name -notlike "*.symbols.nupkg" }
                    Write-Host "Found $($packages.Count) packages to push"
                    foreach ($pkg in $packages) {
                      Write-Host "Pushing $($pkg.Name)..."
                      # Use nuget.exe (6.2.4 from NuGetToolInstaller@1) rather than 'dotnet nuget push':
                      # global.json pins the .NET SDK to 2.1.526, whose 'dotnet nuget push' does not support --skip-duplicate.
                      & nuget.exe push $pkg.FullName -Source $feedUrl -ApiKey AzureDevOps -SkipDuplicate -NonInteractive
                      if ($LASTEXITCODE -ne 0) {
                        Write-Error "Failed to push $($pkg.Name)"
                        exit 1
                      }
                    }
                    Write-Host "Successfully pushed $($packages.Count) packages"

              - task: CopyFiles@2
                displayName: 'Collect "vsman" from $(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)'
                inputs:
                  SourceFolder: '$(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)'
                  Contents: '**\*.?(vsman)'
                  TargetFolder: '$(Build.ArtifactStagingDirectory)\insertion'
                  FlattenFolders: true
                condition: succeeded()

              - task: CopyFiles@2
                displayName: 'Collect "vsix" from $(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)\Vsix'
                inputs:
                  SourceFolder: '$(Build.SourcesDirectory)\Binaries\$(BuildConfiguration)\Vsix'
                  Contents: '**\*.?(vsix)'
                  TargetFolder: '$(Build.ArtifactStagingDirectory)\insertion'
                  FlattenFolders: true
                condition: succeeded()

              # Acquire an Entra token for the DevDiv drop via the WIF service connection
              # (cross-account: dnceng -> devdiv). Done immediately before the upload so the
              # token does not expire during the long build/sign steps. See dotnet/roslyn#83726.
              # The --resource GUID (499b84ac-1321-427f-aa17-267ca6975798) is the Azure DevOps app ID.
              - task: AzureCLI@2
                displayName: 'Get DevDiv Drop Access Token'
                condition: and(succeeded(), eq(variables['SignType'], 'Real'))
                inputs:
                  azureSubscription: 'dnceng-devdiv-drop-rw-code-rw-wif'
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: |
                    $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
                    if ($LASTEXITCODE -ne 0) {
                      Write-Error "Failed to acquire DevDiv drop access token"
                      exit 1
                    }
                    Write-Host "##vso[task.setvariable variable=_DevDivDropAccessToken;issecret=true]$token"
                    Write-Host "##vso[task.setvariable variable=ArtifactServices.Drop.PAT;issecret=true]$token"

              - task: 1ES.MicroBuildVstsDrop@1
                displayName: "Upload artifacts to VSTS Drop"
                inputs:
                  dropFolder: $(Build.ArtifactStagingDirectory)/insertion
                  dropName: $(VisualStudio.DropName)
                  dropRetentionDays: 183
                  accessToken: $(_DevDivDropAccessToken)
                  skipUploadIfExists: true
                  dropServiceUri: 'https://devdiv.artifacts.visualstudio.com'
                  vsDropServiceUri: 'https://vsdrop.corp.microsoft.com/file/v1'
                condition: and(succeeded(), eq(variables['SignType'], 'Real'))
