# TEST ONLY (do not merge): replay historical Roslyn commits through one rolling BigBuild cache
# lineage. The pipeline extends the 1ES Official template so it satisfies dnceng drift-management
# enforcement, but it only builds and publishes experiment artifacts.
#
# Queue this branch through dnceng definition 327.

trigger: none
pr: none

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
- name: slnf
  type: string
  default: 'Roslyn.slnx'
- name: sdkFingerprint
  type: string
  default: 'sdk-11.0.100-preview.6-stock'
- name: ReplayCommit
  type: string
  default: ''
- name: ReplaySequence
  type: number
  default: 0
- name: ReplayExperimentId
  type: string
  default: 'roslyn-history-20260902-10'
- name: ForceCold
  type: boolean
  default: false

variables:
  - name: CacheStore
    value: $(Agent.TempDirectory)/wc-store
  - name: Scripts
    value: $(Agent.TempDirectory)/bigbuild-cache-scripts
  - name: ReplayMetricsDir
    value: $(Build.ArtifactStagingDirectory)/replay-metrics
  - name: ForceCold
    value: ${{ parameters.ForceCold }}
  - name: Seeded
    value: false
  - name: PreviousBaselineSha
    value: ''
  - name: RestoreSeconds
    value: 0
  - name: BuildSeconds
    value: 0
  - name: CaptureSeconds
    value: 0
  - name: Codeql.Enabled
    value: false
  - name: Codeql.SkipTaskAutoInjection
    value: true

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      sourceAnalysisPool:
        name: NetCore1ESPool-Internal
        image: 1es-windows-2022
        os: windows
    pool:
      name: NetCore1ESPool-Internal
      image: windows.vs2026.amd64
      os: windows
    stages:
    - stage: warmcache
      jobs:
      - job: warmcache
        displayName: Warm-clone cache demo (1ES)
        timeoutInMinutes: 240
        templateContext:
          outputs:
          - output: pipelineArtifact
            displayName: Publish warmcache (for next run)
            condition: succeeded()
            targetPath: $(CacheStore)
            artifactName: warmcache
          - output: pipelineArtifact
            displayName: Publish binlogs
            condition: and(succeededOrFailed(), not(canceled()))
            targetPath: $(Build.SourcesDirectory)/artifacts/log
            artifactName: binlogs
          - output: pipelineArtifact
            displayName: Publish replay metrics
            condition: and(succeededOrFailed(), not(canceled()))
            targetPath: $(ReplayMetricsDir)
            artifactName: replay-metrics
        steps:
        - checkout: self
          path: s
          clean: true
          fetchDepth: 0
          persistCredentials: true

        - task: PowerShell@2
          displayName: Prepare historical replay checkout
          inputs:
            targetType: inline
            pwsh: true
            workingDirectory: $(Build.SourcesDirectory)
            script: |
              $ErrorActionPreference = 'Stop'
              $requested = '${{ parameters.ReplayCommit }}'.Trim()
              $experiment = '${{ parameters.ReplayExperimentId }}'.Trim()
              if (-not $requested) { throw 'ReplayCommit is required.' }
              if ($experiment -notmatch '^[A-Za-z0-9._-]+$') {
                throw "ReplayExperimentId '$experiment' contains characters that are unsafe in a cache path."
              }

              New-Item -ItemType Directory -Force "$(ReplayMetricsDir)" | Out-Null
              if (Test-Path "$(Scripts)") { Remove-Item "$(Scripts)" -Recurse -Force }
              Copy-Item "$(Build.SourcesDirectory)/eng/bigbuild-cache/scripts" "$(Scripts)" -Recurse

              git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
              if ($LASTEXITCODE -ne 0) { throw 'failed to fetch origin/main' }
              git cat-file -e "$requested^{commit}"
              if ($LASTEXITCODE -ne 0) { throw "ReplayCommit $requested is not available from origin/main." }
              git checkout --detach --force $requested
              if ($LASTEXITCODE -ne 0) { throw "failed to check out ReplayCommit $requested" }
              $actual = (git rev-parse HEAD).Trim()
              if ($actual -ne $requested) { throw "requested $requested but checked out $actual" }

              Write-Host "Replay sequence ${{ parameters.ReplaySequence }}: $actual"
              Write-Host "Replay experiment: $experiment"
              Write-Host "##vso[task.setvariable variable=ActualReplayCommit]$actual"

        - task: DownloadPipelineArtifact@2
          displayName: Pull warmcache (this branch)
          continueOnError: true
          condition: and(succeeded(), ne(variables['ForceCold'], 'True'))
          inputs:
            buildType: specific
            project: $(System.TeamProjectId)
            definition: $(System.DefinitionId)
            buildVersionToDownload: latestFromBranch
            allowPartiallySucceededBuilds: false
            allowFailedBuilds: false
            branchName: $(Build.SourceBranch)
            artifactName: warmcache
            targetPath: $(CacheStore)

        - task: PowerShell@2
          displayName: Seed from baseline (overlay + back-date)
          inputs:
            targetType: inline
            pwsh: true
            workingDirectory: $(Build.SourcesDirectory)
            script: |
              $ErrorActionPreference = 'Stop'
              if ('${{ parameters.ForceCold }}' -eq 'True') {
                Write-Host "ForceCold=true -- skipping baseline selection."
                Write-Host "##vso[task.setvariable variable=Seeded]false"
                exit 0
              }

              $laneDir = Join-Path "$(CacheStore)" "roslyn-${{ parameters.ReplayExperimentId }}-${{ parameters.sdkFingerprint }}-win"
              $baseline = if (Test-Path $laneDir) {
                Get-ChildItem -Directory $laneDir -ErrorAction SilentlyContinue |
                  Where-Object { Test-Path (Join-Path $_.FullName 'meta.json') } |
                  Sort-Object LastWriteTime | Select-Object -Last 1
              }
              if (-not $baseline) {
                Write-Host "##[warning]No baseline in the experiment lane -- COLD build."
                Write-Host "##vso[task.setvariable variable=Seeded]false"
                exit 0
              }
              $sel = $baseline.FullName
              $baseSha = (Get-Content (Join-Path $sel 'meta.json') -Raw | ConvertFrom-Json).Sha
              Write-Host "==> seeding from $sel"
              & "$(Scripts)/Restore-Baseline.ps1" -RepoRoot "$(Build.SourcesDirectory)" -BaselineDir $sel
              & "$(Scripts)/Replay-Baseline.ps1" -RepoRoot "$(Build.SourcesDirectory)" -BaselineDir $sel `
                -Mode BackDate -MetricsPath "$(ReplayMetricsDir)/input-classification.json"
              Write-Host "##vso[task.setvariable variable=SeededBaselineDir]$sel"
              Write-Host "##vso[task.setvariable variable=PreviousBaselineSha]$baseSha"
              Write-Host "##vso[task.setvariable variable=Seeded]true"

        - task: PowerShell@2
          displayName: Restore (after seed)
          inputs:
            targetType: inline
            pwsh: true
            workingDirectory: $(Build.SourcesDirectory)
            script: |
              $ErrorActionPreference = 'Stop'
              $sw = [Diagnostics.Stopwatch]::StartNew()
              & "$(Build.SourcesDirectory)/eng/build.ps1" -ci -restore -prepareMachine `
                -solution ${{ parameters.slnf }} -binaryLogName Restore.binlog
              if ($LASTEXITCODE -ne 0) { throw "restore failed ($LASTEXITCODE)" }
              $sw.Stop()
              $seconds = [math]::Round($sw.Elapsed.TotalSeconds, 1)
              Write-Host "##[section]Restore finished in $seconds seconds"
              Write-Host "##vso[task.setvariable variable=RestoreSeconds]$seconds"

        - task: PowerShell@2
          displayName: Build (measure cold vs warm)
          inputs:
            targetType: inline
            pwsh: true
            workingDirectory: $(Build.SourcesDirectory)
            script: |
              $ErrorActionPreference = 'Stop'
              Remove-Item -Recurse -Force "$(Build.SourcesDirectory)/artifacts/log" -ErrorAction SilentlyContinue
              $env:DOTNET_MULTILEVEL_LOOKUP = "0"
              $env:ROSLYNUSEHARDLINKS = "1"
              $dotnet = "$(Build.SourcesDirectory)\.dotnet\dotnet.exe"
              $gp = & $dotnet nuget locals global-packages --list 2>$null
              if ("$gp" -match 'global-packages:\s*(.+?)\s*$') { $env:NUGET_PACKAGES = $matches[1].Trim() }
              Write-Host "using NUGET_PACKAGES=$env:NUGET_PACKAGES"
              $sw = [Diagnostics.Stopwatch]::StartNew()
              & $dotnet build ${{ parameters.slnf }} -c Debug -p:ContinuousIntegrationBuild=true -p:DeterministicSourcePaths=true -p:EnableSourceLink=false --no-restore -bl:"$(Build.SourcesDirectory)/artifacts/log/Build.WarmCache.binlog"
              if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }
              $sw.Stop()
              $seconds = [math]::Round($sw.Elapsed.TotalSeconds, 1)
              Write-Host "##[section]Build finished in $seconds seconds (seeded=$(Seeded))"
              Write-Host "##vso[task.setvariable variable=BuildSeconds]$seconds"

        - task: PowerShell@2
          displayName: Capture fresh baseline
          inputs:
            targetType: inline
            pwsh: true
            workingDirectory: $(Build.SourcesDirectory)
            script: |
              $ErrorActionPreference = 'Stop'
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $store = "$(CacheStore)"
              $lane  = "roslyn-${{ parameters.ReplayExperimentId }}-${{ parameters.sdkFingerprint }}-win"
              $sha   = (git rev-parse HEAD).Trim()
              $baselineDir = Join-Path (Join-Path $store $lane) $sha
              $capArgs = @{ RepoRoot = '.'; BaselineDir = $baselineDir; OutputRoots = @('artifacts\obj'); Archive = $true }
              $seeded = $env:SEEDEDBASELINEDIR
              if ($seeded -and (Test-Path (Join-Path $seeded 'outputs.clixml'))) {
                $stash = Join-Path "$(Agent.TempDirectory)" 'prior-baseline'
                New-Item -ItemType Directory -Force $stash | Out-Null
                Copy-Item (Join-Path $seeded 'outputs.clixml') (Join-Path $stash 'outputs.clixml') -Force
                $capArgs['PriorBaselineDir'] = $stash
              }
              if (Test-Path $store) { Remove-Item $store -Recurse -Force }
              & "$(Scripts)/Capture-Baseline.ps1" @capArgs
              if ($LASTEXITCODE -ne 0) { throw "capture failed ($LASTEXITCODE)" }
              $sw.Stop()
              $seconds = [math]::Round($sw.Elapsed.TotalSeconds, 1)
              Write-Host "##vso[task.setvariable variable=CaptureSeconds]$seconds"
              Write-Host "==> captured baseline -> $baselineDir"

        - task: PowerShell@2
          displayName: Write replay metrics
          condition: and(succeededOrFailed(), not(canceled()))
          inputs:
            targetType: inline
            pwsh: true
            workingDirectory: $(Build.SourcesDirectory)
            script: |
              $ErrorActionPreference = 'Stop'
              & "$(Scripts)/Write-ReplayMetrics.ps1" `
                -RepoRoot "$(Build.SourcesDirectory)" `
                -CacheStore "$(CacheStore)" `
                -MetricsDir "$(ReplayMetricsDir)" `
                -ReplayCommit '${{ parameters.ReplayCommit }}' `
                -ReplaySequence ${{ parameters.ReplaySequence }} `
                -ReplayExperimentId '${{ parameters.ReplayExperimentId }}' `
                -SdkFingerprint '${{ parameters.sdkFingerprint }}' `
                -Solution '${{ parameters.slnf }}' `
                -Seeded "$(Seeded)" `
                -PreviousBaselineSha "$(PreviousBaselineSha)" `
                -ForceCold '${{ parameters.ForceCold }}' `
                -RestoreSeconds $(RestoreSeconds) `
                -BuildSeconds $(BuildSeconds) `
                -CaptureSeconds $(CaptureSeconds)
